services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: revision_user
      POSTGRES_PASSWORD: revision_pass
      POSTGRES_DB: revision_vehicular
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql

volumes:
  db_data:
